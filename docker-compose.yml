version: '3'

services:
  susuwhisper:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # Nur lokal erreichbar; von außen über einen Reverse Proxy wie Caddy.
      - "127.0.0.1:8080:8080"
    environment:
      # Hinter dem Reverse Proxy kommen alle Anfragen von derselben Adresse;
      # die echte Client-IP für das Rate-Limit steht in X-Forwarded-For.
      SUSU_TRUST_PROXY: "true"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    restart: unless-stopped
